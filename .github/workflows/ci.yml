name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + ledger, RLS, recurring, capture, Gmail storage and upgrade tests
        run: scripts/test-db.sh

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Gmail Edge Functions
        run: deno check --config supabase/functions/tests/deno.json supabase/functions/gmail-connection/index.ts supabase/functions/gmail-oauth-callback/index.ts supabase/functions/_dev/serve.ts
      - name: OAuth state, callback errors, cross-user isolation, token secrecy, disconnects
        run: deno test --config supabase/functions/tests/deno.json --allow-env supabase/functions/tests/
